name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Semantic Version to release (e.g. 1.0.0-preview.1 or 1.0.0)'
        required: true
        type: string
      dry_run:
        description: 'Perform a dry-run (build, test, pack) without publishing'
        required: true
        type: boolean
        default: true
      publish_to_nuget:
        description: 'Publish packages to NuGet.org (requires manual environment approval)'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify-and-pack:
    name: Verify, Test & Pack
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Determine and validate release version
        id: version_step
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          RAW_VERSION="$INPUT_VERSION"
          if [ -z "$RAW_VERSION" ]; then
            RAW_VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Detected version: $RAW_VERSION"

          SEMVER_REGEX='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ ! "$RAW_VERSION" =~ $SEMVER_REGEX ]]; then
            echo "ERROR: Version '$RAW_VERSION' is not a valid Semantic Version."
            exit 1
          fi
          echo "version=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: Install .NET 8 and .NET 9 SDKs
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Restore solution dependencies
        run: dotnet restore SkyWebFramework.Utility.sln

      - name: Verify package vulnerabilities
        run: dotnet list SkyWebFramework.Utility.sln package --vulnerable --include-transitive

      - name: Build solution in Release mode
        env:
          RELEASE_VERSION: ${{ steps.version_step.outputs.version }}
        run: dotnet build SkyWebFramework.Utility.sln -c Release --no-restore -p:ContinuousIntegrationBuild=true -p:Version="$RELEASE_VERSION"

      - name: Run all solution tests
        run: dotnet test SkyWebFramework.Utility.sln -c Release --no-build --verbosity normal

      - name: Pack NuGet packages and symbols
        env:
          RELEASE_VERSION: ${{ steps.version_step.outputs.version }}
        run: |
          mkdir -p ./artifacts/packages
          dotnet pack SkyWebFramework.Utility.sln -c Release --no-build -o ./artifacts/packages -p:ContinuousIntegrationBuild=true -p:Version="$RELEASE_VERSION"

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          cd ./artifacts/packages
          sha256sum *.nupkg *.snupkg > checksums.sha256 2>/dev/null || sha256sum *.nupkg > checksums.sha256
          echo "=== Checksums ==="
          cat checksums.sha256

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuget-packages
          path: ./artifacts/packages/*
          if-no-files-found: error

  publish-github-release:
    name: Create GitHub Release
    needs: verify-and-pack
    runs-on: ubuntu-latest
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.verify-and-pack.outputs.release_version }}
          name: SkyWebFramework.Utilities v${{ needs.verify-and-pack.outputs.release_version }}
          files: ./release-artifacts/*
          draft: false
          prerelease: ${{ contains(needs.verify-and-pack.outputs.release_version, '-') }}
          generate_release_notes: true

  publish-nuget:
    name: Publish to NuGet.org (Trusted Publishing / OIDC)
    needs: [verify-and-pack]
    runs-on: ubuntu-latest
    environment: nuget-release
    permissions:
      id-token: write
      contents: read
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_to_nuget == true && !inputs.dry_run)
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nuget-packages
          path: ./packages-to-publish

      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '9.0.x'

      - name: NuGet login via OIDC (Trusted Publishing)
        id: nuget-login
        continue-on-error: true
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: ${{ vars.NUGET_USERNAME || 'SuryaPratap29' }}

      - name: Push packages to NuGet.org
        shell: bash
        env:
          OIDC_NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          FALLBACK_NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          API_KEY="$OIDC_NUGET_API_KEY"
          if [ -z "$API_KEY" ]; then
            echo "OIDC key not obtained; checking fallback repository secret NUGET_API_KEY..."
            API_KEY="$FALLBACK_NUGET_API_KEY"
          fi

          if [ -z "$API_KEY" ]; then
            echo "ERROR: Neither NuGet Trusted Publishing OIDC token nor NUGET_API_KEY secret is available."
            exit 1
          fi

          for pkg in ./packages-to-publish/*.nupkg; do
            echo "Publishing $pkg to NuGet.org..."
            dotnet nuget push "$pkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$API_KEY" \
              --skip-duplicate
          done